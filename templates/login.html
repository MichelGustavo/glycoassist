<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar — GlycoAssist</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="pagina-login">
  <main class="login-container">
    <section class="login-card" aria-labelledby="titulo-login">
      <div class="login-marca">
        <div class="marca-icone marca-icone-grande" aria-hidden="true">G</div>
        <span>GlycoAssist</span>
      </div>

      <div class="login-intro">
        <h1 id="titulo-login">Bem-vindo de volta</h1>
        <p>Entre para consultar os dados dos seus pacientes.</p>
      </div>

      {% if erro %}
        <div class="login-erro" role="alert">{{ erro }}</div>
      {% endif %}

      <form method="post" class="login-formulario">
        <div class="grupo-campo">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" value="{{ email }}" placeholder="voce@exemplo.com" autocomplete="username" required autofocus />
        </div>
        <div class="grupo-campo">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" required />
        </div>
        <button type="submit" class="botao-entrar">Entrar</button>
      </form>

      <p class="login-rodape">Acesso ao ambiente de acompanhamento clínico</p>
    </section>
  </main>
</body>
</html>
